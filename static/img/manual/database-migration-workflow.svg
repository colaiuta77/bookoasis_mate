<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" lang="ko" aria-labelledby="database-migration-workflow-title database-migration-workflow-desc">
<title id="database-migration-workflow-title">데이터 이관과 복원</title><desc id="database-migration-workflow-desc">원본 유형에 따라 검사와 적용 방식이 다릅니다. 적용 전 백업은 필수입니다. 실제 적용 전 BookOasis 작업을 중지하고, 완료 후 결과를 검증합니다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#292735}.muted{fill:#625e70;font-size:16px}.name{font-size:24px;font-weight:700}.tag{fill:#56349a;font-size:16px;font-weight:700}</style>
<defs><marker id="database-migration-workflow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#777181"/></marker></defs>
<rect width="1200" height="100%" fill="#faf9fc"/><rect x="40" y="40" width="40" height="4" fill="#56349a"/><text x="40" y="88" font-size="32" font-weight="700">데이터 이관과 복원</text><text x="40" y="124" class="muted">원본 유형에 따라 검사와 적용 방식이 다릅니다. 적용 전 백업은 필수입니다.</text>
<text x="40" y="180" class="tag">01  Kavita → BookOasis</text>
<path d="M376 256H420" stroke="#777181" stroke-width="2" marker-end="url(#database-migration-workflow-arrow)"/>
<path d="M768 256H812" stroke="#777181" stroke-width="2" marker-end="url(#database-migration-workflow-arrow)"/>
<rect x="40" y="200" width="336" height="112" rx="4" fill="#ffffff" stroke="#c9c4d2"/><text x="60" y="240" class="name">kavita.db</text><text x="60" y="268" class="muted">도서 · 표지 · 진행률</text><rect x="432" y="200" width="336" height="112" rx="4" fill="#eee8f8" stroke="#56349a"/><text x="452" y="240" class="name">검사 · 매핑 · Dry Run</text><text x="452" y="268" class="muted">보관함 · 경로 · 사용자</text><text x="452" y="292" class="muted">적용 전 대상 DB 백업</text><rect x="824" y="200" width="336" height="112" rx="4" fill="#ffffff" stroke="#c9c4d2"/><text x="844" y="240" class="name">도서 반영</text><text x="844" y="268" class="muted">신규 생성 · 기존 갱신</text><text x="40" y="360" class="tag">02  BookOasis 패키지 복원</text>
<path d="M376 436H420" stroke="#777181" stroke-width="2" marker-end="url(#database-migration-workflow-arrow)"/>
<path d="M768 436H812" stroke="#777181" stroke-width="2" marker-end="url(#database-migration-workflow-arrow)"/>
<rect x="40" y="380" width="336" height="112" rx="4" fill="#ffffff" stroke="#c9c4d2"/><text x="60" y="420" class="name">DB · 표지 패키지</text><text x="60" y="448" class="muted">동일 엔진 복원</text><rect x="432" y="380" width="336" height="112" rx="4" fill="#eee8f8" stroke="#56349a"/><text x="452" y="420" class="name">검사 · 매핑 · Dry Run</text><text x="452" y="448" class="muted">무결성 · 경로 · 표지</text><text x="452" y="472" class="muted">적용 전 대상 DB 백업</text><rect x="824" y="380" width="336" height="112" rx="4" fill="#ffffff" stroke="#c9c4d2"/><text x="844" y="420" class="name">전체 교체</text><text x="844" y="448" class="muted">DB · 표지 복원</text><path d="M40 540H1160" stroke="#d7d2df"/><text x="40" y="572" class="muted">실제 적용 전 BookOasis 작업을 중지하고, 완료 후 결과를 검증합니다.</text><text x="40" y="604" class="tag">BOOKOASIS MATE · 실선은 처리 흐름 · 보라색은 핵심 처리</text></svg>
