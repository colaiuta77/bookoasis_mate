<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1040" role="img" lang="ko" aria-labelledby="local-watch-detail-title local-watch-detail-desc">
<title id="local-watch-detail-title">로컬 폴더 감지 · 상세 처리 흐름</title><desc id="local-watch-detail-desc">실선은 처리 흐름, 점선은 저장 확인 후 반영 또는 오류 분기입니다. 이동은 삭제와 생성으로 표현합니다. 재시작은 전체 상태를 대조합니다. 새 기준 시작은 중지 중 변경을 처리하지 않고 성공한 조회로 기준만 교체합니다. 최초·정기 전체 조회와 inotify 재등록 비용은 남습니다. 큐/기준 저장 사이 종료 시 이벤트가 재전달될 수 있습니다.</desc><defs><marker id="local-watch-detail-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#736a82"/></marker></defs><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#292735}.small{font-size:16px;fill:#625e70}.name{font-size:20px;font-weight:700}.lane{font-size:16px;font-weight:700;fill:#56349a}</style><rect width="1480" height="1040" fill="#faf9fc"/><text x="40" y="64" font-size="32" font-weight="700">로컬 폴더 감지 · 상세 처리 흐름</text><text x="40" y="100" class="small">담당 영역별 처리 흐름 · 빈 칸은 해당 단계에 작업이 없는 영역입니다.</text>
<text x="288" y="156" text-anchor="middle" class="lane">01  입력 / 시작</text><text x="540" y="156" text-anchor="middle" class="lane">02  수집 / 비교</text><text x="792" y="156" text-anchor="middle" class="lane">03  영속 저장</text><text x="1044" y="156" text-anchor="middle" class="lane">04  실행 / 보호</text><text x="1296" y="156" text-anchor="middle" class="lane">05  결과 / 복구</text><rect x="24" y="188" width="1432" height="144" fill="#faf9fc"/><path d="M24 188H1456" stroke="#ded9e6"/><text x="40" y="244" class="lane">파일시스템</text><text x="40" y="272" class="small">FF 내부 경로</text><rect x="24" y="332" width="1432" height="144" fill="#f2eff7"/><path d="M24 332H1456" stroke="#ded9e6"/><text x="40" y="388" class="lane">감지 프로세스</text><text x="40" y="416" class="small">루트별 순차 조회</text><rect x="24" y="476" width="1432" height="144" fill="#faf9fc"/><path d="M24 476H1456" stroke="#ded9e6"/><text x="40" y="532" class="lane">기준 SQLite</text><text x="40" y="560" class="small">이벤트 DB와 별도</text><rect x="24" y="620" width="1432" height="144" fill="#f2eff7"/><path d="M24 620H1456" stroke="#ded9e6"/><text x="40" y="676" class="lane">이벤트 큐</text><text x="40" y="704" class="small">영속 저장과 처리</text><rect x="24" y="764" width="1432" height="144" fill="#faf9fc"/><path d="M24 764H1456" stroke="#ded9e6"/><text x="40" y="820" class="lane">BookOasis</text><text x="40" y="848" class="small">미디어 반영</text><path d="M160 180V904" stroke="#d2cadf"/><path d="M396 252H404Q412 252 412 260V372Q412 380 420 380H424" fill="none" stroke="#736a82" stroke-width="2"  marker-end="url(#local-watch-detail-arrow)"/><path d="M396 540H404Q412 540 412 532V420Q412 412 420 412H424" fill="none" stroke="#736a82" stroke-width="2"  marker-end="url(#local-watch-detail-arrow)"/><path d="M648 396H656Q664 396 664 404V676Q664 684 672 684H676" fill="none" stroke="#736a82" stroke-width="2"  marker-end="url(#local-watch-detail-arrow)"/><path d="M792 636V604" fill="none" stroke="#736a82" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#local-watch-detail-arrow)"/><path d="M900 684H928" fill="none" stroke="#736a82" stroke-width="2"  marker-end="url(#local-watch-detail-arrow)"/><path d="M1152 684H1160Q1168 684 1168 692V820Q1168 828 1176 828H1180" fill="none" stroke="#736a82" stroke-width="2"  marker-end="url(#local-watch-detail-arrow)"/><path d="M648 396H1180" fill="none" stroke="#736a82" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#local-watch-detail-arrow)"/><rect x="180" y="204" width="216" height="104" rx="4" fill="#fff" stroke="#bdb5ca"/><text x="192" y="232" class="name">현재 파일 / 폴더</text><text x="192" y="260" class="small">Linux 실시간 신호</text><text x="192" y="284" class="small">CIFS·NFS·FUSE 폴링</text><rect x="180" y="492" width="216" height="104" rx="4" fill="#fff" stroke="#bdb5ca"/><text x="192" y="520" class="name">저장된 기준 복원</text><text x="192" y="548" class="small">이어서 시작 시 사용</text><text x="192" y="572" class="small">없으면 최초 기준</text><rect x="432" y="348" width="216" height="104" rx="4" fill="#ede5fa" stroke="#56349a"/><text x="444" y="376" class="name">조회 / 변경 비교</text><text x="444" y="404" class="small">제외 패턴 · 확장자</text><text x="444" y="428" class="small">마운트·대량 삭제 보호</text><rect x="684" y="636" width="216" height="104" rx="4" fill="#ede5fa" stroke="#56349a"/><text x="696" y="664" class="name">이벤트 큐 저장</text><text x="696" y="692" class="small">생성 · 수정 · 삭제</text><text x="696" y="716" class="small">저장 확인 응답</text><rect x="684" y="492" width="216" height="104" rx="4" fill="#fff" stroke="#bdb5ca"/><text x="696" y="520" class="name">기준 변경분 저장</text><text x="696" y="548" class="small">큐 저장 확인 이후</text><text x="696" y="572" class="small">조회 실패 시 기준 보존</text><rect x="936" y="636" width="216" height="104" rx="4" fill="#fff" stroke="#bdb5ca"/><text x="948" y="664" class="name">대기 이벤트 처리</text><text x="948" y="692" class="small">경로 매핑 · 보관함 확인</text><text x="948" y="716" class="small">스캔 요청 / 재시도</text><rect x="1188" y="780" width="216" height="104" rx="4" fill="#fff" stroke="#bdb5ca"/><text x="1200" y="808" class="name">BookOasis 스캔</text><text x="1200" y="836" class="small">요청 결과 기록</text><text x="1200" y="860" class="small">로컬은 VFS 명령 없음</text><rect x="1188" y="348" width="216" height="104" rx="4" fill="#fff" stroke="#bdb5ca"/><text x="1200" y="376" class="name">오류 시 보류</text><text x="1200" y="404" class="small">기준·미처리 큐 보존</text><text x="1200" y="428" class="small">원인 확인 후 재개</text><path d="M40 920H1440" stroke="#d2cadf"/><text x="40" y="952" class="small">실선은 처리 흐름, 점선은 저장 확인 후 반영 또는 오류 분기입니다. 이동은 삭제와 생성으로 표현합니다.</text><text x="40" y="980" class="small">재시작은 전체 상태를 대조합니다. 새 기준 시작은 중지 중 변경을 처리하지 않고 성공한 조회로 기준만 교체합니다.</text><text x="40" y="1008" class="small">최초·정기 전체 조회와 inotify 재등록 비용은 남습니다. 큐/기준 저장 사이 종료 시 이벤트가 재전달될 수 있습니다.</text></svg>
