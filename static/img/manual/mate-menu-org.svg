<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1000" role="img" lang="ko" aria-labelledby="mate-menu-title mate-menu-desc">
<title id="mate-menu-title">BookOasis Mate 메뉴와 핵심 기능</title><desc id="mate-menu-desc">Mate의 실제 메뉴 11개를 연결 설정, 진단과 조회, 데이터 이관, 변경 감지, 관리와 도움말로 묶어 각 메뉴가 담당하는 기능을 안내합니다. 묶음은 설명용이며 실행 순서가 아닙니다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#292735}.name{font-size:20px;font-weight:700}.body{font-size:16px;fill:#625e70}.group{font-size:20px;font-weight:700;fill:#56349a}</style>
<rect width="1520" height="1000" fill="#faf9fc"/><text x="40" y="60" font-size="32" font-weight="700">메뉴별로 살펴보는 BookOasis Mate</text><text x="40" y="96" class="body">원하는 작업에 맞는 메뉴를 찾으세요. 연결선은 메뉴의 기능 묶음을 나타냅니다.</text>
<rect x="552" y="132" width="416" height="92" rx="4" fill="#ede5fa" stroke="#56349a"/><text x="760" y="172" font-size="28" font-weight="700" text-anchor="middle">BookOasis Mate</text><text x="760" y="200" class="body" text-anchor="middle">FlaskFarm에서 관리하는 BookOasis 도구</text>
<path d="M760 224V252M168 252H1352" stroke="#968bA6" fill="none" stroke-width="2"/>
<path d="M168 252V280" stroke="#968ba6" stroke-width="2"/><text x="168" y="308" class="group" text-anchor="middle">연결 설정</text><rect x="64" y="348" width="248" height="124" rx="4" fill="#fff" stroke="#c9c1d4"/><text x="80" y="376" class="name">설정</text><text x="80" y="404" class="body">BookOasis · DB 연결</text><text x="80" y="428" class="body">Docker · 필수 구성요소</text><text x="80" y="452" class="body">업데이트 · 연결 검사</text><path d="M464 252V280" stroke="#968ba6" stroke-width="2"/><text x="464" y="308" class="group" text-anchor="middle">진단·조회</text><rect x="360" y="348" width="248" height="124" rx="4" fill="#fff" stroke="#c9c1d4"/><text x="376" y="376" class="name">라이브러리 진단</text><text x="376" y="404" class="body">상태 · 통계 · 스캔 현황</text><text x="376" y="428" class="body">문제 도서 · 시리즈 누락</text><text x="376" y="452" class="body">표지 검사 · 고아 표지 정리</text><rect x="360" y="488" width="248" height="124" rx="4" fill="#fff" stroke="#c9c1d4"/><text x="376" y="516" class="name">SQL 도구</text><text x="376" y="544" class="body">DB 선택 · SQL 조회</text><text x="376" y="568" class="body">쿼리 결과 확인</text><path d="M760 252V280" stroke="#968ba6" stroke-width="2"/><text x="760" y="308" class="group" text-anchor="middle">데이터 이관</text><rect x="656" y="348" width="248" height="124" rx="4" fill="#fff" stroke="#c9c1d4"/><text x="672" y="376" class="name">카테고리 이관</text><text x="672" y="404" class="body">복사 설정 · 대상 선택</text><text x="672" y="428" class="body">작업 상태 · 이관 안내</text><rect x="656" y="488" width="248" height="124" rx="4" fill="#fff" stroke="#c9c1d4"/><text x="672" y="516" class="name">통DB 이관</text><text x="672" y="544" class="body">Kavita / 패키지 이관</text><text x="672" y="568" class="body">검사 · 매핑 · Dry Run</text><text x="672" y="592" class="body">백업 · 적용 · 결과 확인</text><path d="M1056 252V280" stroke="#968ba6" stroke-width="2"/><text x="1056" y="308" class="group" text-anchor="middle">변경 감지</text><rect x="952" y="348" width="248" height="124" rx="4" fill="#fff" stroke="#c9c1d4"/><text x="968" y="376" class="name">Google Drive 연동</text><text x="968" y="404" class="body">Changes / Activity</text><text x="968" y="428" class="body">gd-poller 명령·웹훅</text><text x="968" y="452" class="body">변경 큐 · 스캔 요청</text><rect x="952" y="488" width="248" height="124" rx="4" fill="#fff" stroke="#c9c1d4"/><text x="968" y="516" class="name">로컬 폴더 감지</text><text x="968" y="544" class="body">실시간 / 폴링 감지</text><text x="968" y="568" class="body">기준 저장 · 이어서 시작</text><text x="968" y="592" class="body">실패 확인 · 일괄 재시도</text><path d="M1352 252V280" stroke="#968ba6" stroke-width="2"/><text x="1352" y="308" class="group" text-anchor="middle">관리·도움말</text><rect x="1248" y="348" width="248" height="124" rx="4" fill="#fff" stroke="#c9c1d4"/><text x="1264" y="376" class="name">플러그인 관리</text><text x="1264" y="404" class="body">카탈로그 · 저장소 · ZIP</text><text x="1264" y="428" class="body">패키지 검사 · 설치 이력</text><rect x="1248" y="488" width="248" height="124" rx="4" fill="#fff" stroke="#c9c1d4"/><text x="1264" y="516" class="name">커스텀 폰트</text><text x="1264" y="544" class="body">폰트 업로드 · 목록 관리</text><text x="1264" y="568" class="body">저장 경로 설정</text><rect x="1248" y="628" width="248" height="124" rx="4" fill="#fff" stroke="#c9c1d4"/><text x="1264" y="656" class="name">매뉴얼</text><text x="1264" y="684" class="body">공통 설치 · 연결 안내</text><text x="1264" y="708" class="body">기능 구성도 · 변경 이력</text><rect x="1248" y="768" width="248" height="124" rx="4" fill="#fff" stroke="#c9c1d4"/><text x="1264" y="796" class="name">로그</text><text x="1264" y="824" class="body">Mate 동작 로그</text><text x="1264" y="848" class="body">오류 원인 확인</text><path d="M40 928H1480" stroke="#d2cadf"/><text x="40" y="960" class="body">설명용 기능 묶음입니다. 실제 메뉴 이름은 그대로 유지되며, 세부 절차와 안전 조건은 각 메뉴의 매뉴얼을 확인하세요.</text></svg>
