<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" lang="ko" aria-labelledby="gdrive-change-workflow-title gdrive-change-workflow-desc">
<title id="gdrive-change-workflow-title">Google Drive 변경 처리</title><desc id="gdrive-change-workflow-desc">입력 방식은 설정에서 선택하고, 수신 이후 공통 큐에서 처리합니다. 실패는 기록·재시도합니다. 결과가 불확실한 시간 초과는 작업 확인 후 수동 재시도합니다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#292735}.muted{fill:#625e70;font-size:16px}.name{font-size:24px;font-weight:700}.tag{fill:#56349a;font-size:16px;font-weight:700}</style>
<defs><marker id="gdrive-change-workflow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#777181"/></marker></defs>
<rect width="1200" height="100%" fill="#faf9fc"/><rect x="40" y="40" width="40" height="4" fill="#56349a"/><text x="40" y="88" font-size="32" font-weight="700">Google Drive 변경 처리</text><text x="40" y="124" class="muted">입력 방식은 설정에서 선택하고, 수신 이후 공통 큐에서 처리합니다.</text>
<text x="40" y="180" class="tag">01  감지 방식 선택 → 이벤트 저장</text>
<path d="M376 256H420" stroke="#777181" stroke-width="2" marker-end="url(#gdrive-change-workflow-arrow)"/>
<path d="M768 256H812" stroke="#777181" stroke-width="2" marker-end="url(#gdrive-change-workflow-arrow)"/>
<rect x="40" y="200" width="336" height="112" rx="4" fill="#ffffff" stroke="#c9c4d2"/><text x="60" y="240" class="name">Google Drive</text><text x="60" y="268" class="muted">감시 폴더의 변경</text><rect x="432" y="200" width="336" height="112" rx="4" fill="#ffffff" stroke="#c9c4d2"/><text x="452" y="240" class="name">이벤트 입력</text><text x="452" y="268" class="muted">gd-poller 명령 / 웹훅</text><text x="452" y="292" class="muted">또는 Mate Changes / Activity</text><rect x="824" y="200" width="336" height="112" rx="4" fill="#eee8f8" stroke="#56349a"/><text x="844" y="240" class="name">Mate 이벤트 DB</text><text x="844" y="268" class="muted">영속 저장 · 중복 정리</text><text x="844" y="292" class="muted">버퍼 후 처리</text><text x="40" y="360" class="tag">02  저장 이벤트 → 경로 처리 → 스캔 요청</text>
<path d="M376 436H420" stroke="#777181" stroke-width="2" marker-end="url(#gdrive-change-workflow-arrow)"/>
<path d="M768 436H812" stroke="#777181" stroke-width="2" marker-end="url(#gdrive-change-workflow-arrow)"/>
<rect x="40" y="380" width="336" height="112" rx="4" fill="#ffffff" stroke="#c9c4d2"/><text x="60" y="420" class="name">대기열 작업자</text><text x="60" y="448" class="muted">경로 매핑 · 보관함 확인</text><rect x="432" y="380" width="336" height="112" rx="4" fill="#ffffff" stroke="#c9c4d2"/><text x="452" y="420" class="name">이전 경로 정리</text><text x="452" y="448" class="muted">이동·삭제의 VFS forget</text><text x="452" y="472" class="muted">현재 경로 갱신은 BookOasis</text><rect x="824" y="380" width="336" height="112" rx="4" fill="#eee8f8" stroke="#56349a"/><text x="844" y="420" class="name">BookOasis 스캔</text><text x="844" y="448" class="muted">개별 경로 요청</text><text x="844" y="472" class="muted">필요 시 보관함 스캔</text><path d="M40 540H1160" stroke="#d7d2df"/><text x="40" y="572" class="muted">실패는 기록·재시도합니다. 결과가 불확실한 시간 초과는 작업 확인 후 수동 재시도합니다.</text><text x="40" y="604" class="tag">BOOKOASIS MATE · 실선은 처리 흐름 · 보라색은 핵심 처리</text></svg>
