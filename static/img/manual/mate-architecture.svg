<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" lang="ko" aria-labelledby="mate-architecture-title mate-architecture-desc">
<title id="mate-architecture-title">BookOasis Mate 전체 구조</title><desc id="mate-architecture-desc">FlaskFarm의 Mate가 작업을 조정하고 BookOasis가 미디어를 처리합니다. 진단·이관은 DB에도 접근합니다. 컨테이너 경로는 서로 다를 수 있습니다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#292735}.muted{fill:#625e70;font-size:16px}.name{font-size:24px;font-weight:700}.tag{fill:#56349a;font-size:16px;font-weight:700}</style>
<defs><marker id="mate-architecture-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#777181"/></marker></defs>
<rect width="1200" height="100%" fill="#faf9fc"/><rect x="40" y="40" width="40" height="4" fill="#56349a"/><text x="40" y="88" font-size="32" font-weight="700">BookOasis Mate 전체 구조</text><text x="40" y="124" class="muted">FlaskFarm의 Mate가 작업을 조정하고 BookOasis가 미디어를 처리합니다.</text>
<text x="40" y="180" class="tag">01  사용자 → 연동 제어 → 서비스</text>
<path d="M376 256H420" stroke="#777181" stroke-width="2" marker-end="url(#mate-architecture-arrow)"/>
<path d="M768 256H812" stroke="#777181" stroke-width="2" marker-end="url(#mate-architecture-arrow)"/>
<rect x="40" y="200" width="336" height="112" rx="4" fill="#ffffff" stroke="#c9c4d2"/><text x="60" y="240" class="name">관리자</text><text x="60" y="268" class="muted">FlaskFarm 메뉴 · 설정과 실행</text><rect x="432" y="200" width="336" height="112" rx="4" fill="#eee8f8" stroke="#56349a"/><text x="452" y="240" class="name">BookOasis Mate</text><text x="452" y="268" class="muted">진단 · 이관 · 변경 감지</text><text x="452" y="292" class="muted">메뉴 / AJAX / 작업자</text><rect x="824" y="200" width="336" height="112" rx="4" fill="#ffffff" stroke="#c9c4d2"/><text x="844" y="240" class="name">BookOasis API</text><text x="844" y="268" class="muted">스캔 요청 · 도서 작업</text><text x="40" y="360" class="tag">02  변경 입력 → 영속 처리 → 미디어 반영</text>
<path d="M376 436H420" stroke="#777181" stroke-width="2" marker-end="url(#mate-architecture-arrow)"/>
<path d="M768 436H812" stroke="#777181" stroke-width="2" marker-end="url(#mate-architecture-arrow)"/>
<rect x="40" y="380" width="336" height="112" rx="4" fill="#ffffff" stroke="#c9c4d2"/><text x="60" y="420" class="name">Drive · 로컬 폴더</text><text x="60" y="448" class="muted">rclone / gd-poller / 자체 감지</text><text x="60" y="472" class="muted">로컬 실시간 또는 폴링</text><rect x="432" y="380" width="336" height="112" rx="4" fill="#eee8f8" stroke="#56349a"/><text x="452" y="420" class="name">Mate DB · 별도 프로세스</text><text x="452" y="448" class="muted">설정 · 이벤트 큐 · 감시 기준</text><text x="452" y="472" class="muted">통계 · 이관 · 정리 작업</text><rect x="824" y="380" width="336" height="112" rx="4" fill="#ffffff" stroke="#c9c4d2"/><text x="844" y="420" class="name">BookOasis DB · Redis</text><text x="844" y="448" class="muted">SQLite / MariaDB</text><text x="844" y="472" class="muted">미디어 데이터 · 진행 상태</text><path d="M40 540H1160" stroke="#d7d2df"/><text x="40" y="572" class="muted">진단·이관은 DB에도 접근합니다. 컨테이너 경로는 서로 다를 수 있습니다.</text><text x="40" y="604" class="tag">BOOKOASIS MATE · 실선은 처리 흐름 · 보라색은 핵심 처리</text></svg>
