<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" lang="ko" aria-labelledby="local-watch-workflow-title local-watch-workflow-desc">
<title id="local-watch-workflow-title">로컬 폴더 감지와 이어서 시작</title><desc id="local-watch-workflow-desc">감시 기준과 이벤트 큐는 별도로 저장하며, 감지와 스캔 요청을 분리합니다. 새 기준 시작은 중지 중 변경을 처리하지 않습니다. 재시작 전체 확인과 inotify 등록은 필요합니다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#292735}.muted{fill:#625e70;font-size:16px}.name{font-size:24px;font-weight:700}.tag{fill:#56349a;font-size:16px;font-weight:700}</style>
<defs><marker id="local-watch-workflow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#777181"/></marker></defs>
<rect width="1200" height="100%" fill="#faf9fc"/><rect x="40" y="40" width="40" height="4" fill="#56349a"/><text x="40" y="88" font-size="32" font-weight="700">로컬 폴더 감지와 이어서 시작</text><text x="40" y="124" class="muted">감시 기준과 이벤트 큐는 별도로 저장하며, 감지와 스캔 요청을 분리합니다.</text>
<text x="40" y="180" class="tag">01  실제 파일 → 기준 비교 → 이벤트 전달</text>
<path d="M376 256H420" stroke="#777181" stroke-width="2" marker-end="url(#local-watch-workflow-arrow)"/>
<path d="M768 256H812" stroke="#777181" stroke-width="2" marker-end="url(#local-watch-workflow-arrow)"/>
<rect x="40" y="200" width="336" height="112" rx="4" fill="#ffffff" stroke="#c9c4d2"/><text x="60" y="240" class="name">감시 경로</text><text x="60" y="268" class="muted">Linux 로컬 실시간</text><text x="60" y="292" class="muted">CIFS / NFS / FUSE 폴링</text><rect x="432" y="200" width="336" height="112" rx="4" fill="#eee8f8" stroke="#56349a"/><text x="452" y="240" class="name">별도 감지 프로세스</text><text x="452" y="268" class="muted">제외 패턴 · 확장자 적용</text><text x="452" y="292" class="muted">변경 비교 · 마운트 보호</text><rect x="824" y="200" width="336" height="112" rx="4" fill="#ffffff" stroke="#c9c4d2"/><text x="844" y="240" class="name">로컬 이벤트 큐</text><text x="844" y="268" class="muted">영속 저장 확인</text><text x="844" y="292" class="muted">경로 매핑 · BookOasis 요청</text><text x="40" y="360" class="tag">02  재시작 → 전체 대조 → 이어서 감지</text>
<path d="M376 436H420" stroke="#777181" stroke-width="2" marker-end="url(#local-watch-workflow-arrow)"/>
<path d="M768 436H812" stroke="#777181" stroke-width="2" marker-end="url(#local-watch-workflow-arrow)"/>
<rect x="40" y="380" width="336" height="112" rx="4" fill="#ffffff" stroke="#c9c4d2"/><text x="60" y="420" class="name">저장된 SQLite 기준</text><text x="60" y="448" class="muted">파일 · 폴더 상태 복원</text><text x="60" y="472" class="muted">기준이 없으면 최초 수집</text><rect x="432" y="380" width="336" height="112" rx="4" fill="#eee8f8" stroke="#56349a"/><text x="452" y="420" class="name">현재 상태 전체 대조</text><text x="452" y="448" class="muted">중지 중 추가·수정·삭제 확인</text><text x="452" y="472" class="muted">오류 시 기존 기준 보존</text><rect x="824" y="380" width="336" height="112" rx="4" fill="#ffffff" stroke="#c9c4d2"/><text x="844" y="420" class="name">변경분만 저장</text><text x="844" y="448" class="muted">큐 저장 확인 후 기준 반영</text><text x="844" y="472" class="muted">이후 실시간 / 폴링 감지</text><path d="M40 540H1160" stroke="#d7d2df"/><text x="40" y="572" class="muted">새 기준 시작은 중지 중 변경을 처리하지 않습니다. 재시작 전체 확인과 inotify 등록은 필요합니다.</text><text x="40" y="604" class="tag">BOOKOASIS MATE · 실선은 처리 흐름 · 보라색은 핵심 처리</text></svg>
