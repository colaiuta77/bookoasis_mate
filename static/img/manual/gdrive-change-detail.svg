<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1040" role="img" lang="ko" aria-labelledby="gdrive-change-detail-title gdrive-change-detail-desc">
<title id="gdrive-change-detail-title">Google Drive 연동 · 상세 처리 흐름</title><desc id="gdrive-change-detail-desc">실선은 전달·실행 흐름입니다. 명령·웹훅·자체 감지를 동시에 중복 구성하지 않습니다. 실패는 큐에 기록합니다. 결과 불명 시간 초과는 자동 재시도하지 않으며, 작업·로그 확인 후 수동 재시도합니다. API 요청 완료는 전체 스캔 완료와 다를 수 있습니다. 실제 처리 상태는 BookOasis에서 확인하세요.</desc><defs><marker id="gdrive-change-detail-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#736a82"/></marker></defs><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#292735}.small{font-size:16px;fill:#625e70}.name{font-size:20px;font-weight:700}.lane{font-size:16px;font-weight:700;fill:#56349a}</style><rect width="1480" height="1040" fill="#faf9fc"/><text x="40" y="64" font-size="32" font-weight="700">Google Drive 연동 · 상세 처리 흐름</text><text x="40" y="100" class="small">담당 영역별 처리 흐름 · 빈 칸은 해당 단계에 작업이 없는 영역입니다.</text>
<text x="288" y="156" text-anchor="middle" class="lane">01  입력 / 시작</text><text x="540" y="156" text-anchor="middle" class="lane">02  수집 / 비교</text><text x="792" y="156" text-anchor="middle" class="lane">03  영속 저장</text><text x="1044" y="156" text-anchor="middle" class="lane">04  실행 / 보호</text><text x="1296" y="156" text-anchor="middle" class="lane">05  결과 / 복구</text><rect x="24" y="188" width="1432" height="144" fill="#faf9fc"/><path d="M24 188H1456" stroke="#ded9e6"/><text x="40" y="244" class="lane">외부 감지</text><text x="40" y="272" class="small">gd-poller</text><rect x="24" y="332" width="1432" height="144" fill="#f2eff7"/><path d="M24 332H1456" stroke="#ded9e6"/><text x="40" y="388" class="lane">자체 감지</text><text x="40" y="416" class="small">rclone 인증 사용</text><rect x="24" y="476" width="1432" height="144" fill="#faf9fc"/><path d="M24 476H1456" stroke="#ded9e6"/><text x="40" y="532" class="lane">이벤트 DB</text><text x="40" y="560" class="small">저장과 대기</text><rect x="24" y="620" width="1432" height="144" fill="#f2eff7"/><path d="M24 620H1456" stroke="#ded9e6"/><text x="40" y="676" class="lane">Mate 작업자</text><text x="40" y="704" class="small">매핑과 요청</text><rect x="24" y="764" width="1432" height="144" fill="#faf9fc"/><path d="M24 764H1456" stroke="#ded9e6"/><text x="40" y="820" class="lane">BookOasis</text><text x="40" y="848" class="small">실제 스캔</text><path d="M160 180V904" stroke="#d2cadf"/><path d="M396 252H424" fill="none" stroke="#736a82" stroke-width="2"  marker-end="url(#gdrive-change-detail-arrow)"/><path d="M396 396H424" fill="none" stroke="#736a82" stroke-width="2"  marker-end="url(#gdrive-change-detail-arrow)"/><path d="M648 252H908Q916 252 916 260V468Q916 476 908 476H800Q792 476 792 484" fill="none" stroke="#736a82" stroke-width="2"  marker-end="url(#gdrive-change-detail-arrow)"/><path d="M648 396H656Q664 396 664 404V532Q664 540 672 540H676" fill="none" stroke="#736a82" stroke-width="2"  marker-end="url(#gdrive-change-detail-arrow)"/><path d="M900 540H928" fill="none" stroke="#736a82" stroke-width="2"  marker-end="url(#gdrive-change-detail-arrow)"/><path d="M1044 596V628" fill="none" stroke="#736a82" stroke-width="2"  marker-end="url(#gdrive-change-detail-arrow)"/><path d="M1152 684H1180" fill="none" stroke="#736a82" stroke-width="2"  marker-end="url(#gdrive-change-detail-arrow)"/><path d="M1296 740V772" fill="none" stroke="#736a82" stroke-width="2"  marker-end="url(#gdrive-change-detail-arrow)"/><rect x="180" y="204" width="216" height="104" rx="4" fill="#fff" stroke="#bdb5ca"/><text x="192" y="232" class="name">명령 / 웹훅</text><text x="192" y="260" class="small">둘 중 설정 방식 사용</text><rect x="432" y="204" width="216" height="104" rx="4" fill="#fff" stroke="#bdb5ca"/><text x="444" y="232" class="name">래퍼 또는 API</text><text x="444" y="260" class="small">이벤트 형식 검증</text><rect x="180" y="348" width="216" height="104" rx="4" fill="#fff" stroke="#bdb5ca"/><text x="192" y="376" class="name">Changes / Activity</text><text x="192" y="404" class="small">감시 경로별 방식 선택</text><rect x="432" y="348" width="216" height="104" rx="4" fill="#fff" stroke="#bdb5ca"/><text x="444" y="376" class="name">변경 내역 수집</text><text x="444" y="404" class="small">경로 확인 · 범위 판별</text><rect x="684" y="492" width="216" height="104" rx="4" fill="#ede5fa" stroke="#56349a"/><text x="696" y="520" class="name">이벤트 영속 저장</text><text x="696" y="548" class="small">대기 · 중복 정리</text><text x="696" y="572" class="small">버퍼 후 처리</text><rect x="936" y="492" width="216" height="104" rx="4" fill="#fff" stroke="#bdb5ca"/><text x="948" y="520" class="name">큐에서 작업 선택</text><text x="948" y="548" class="small">처리 상태 갱신</text><rect x="936" y="636" width="216" height="104" rx="4" fill="#fff" stroke="#bdb5ca"/><text x="948" y="664" class="name">보관함 / 경로 검증</text><text x="948" y="692" class="small">이전 경로 VFS 정리</text><text x="948" y="716" class="small">삭제·이동에 적용</text><rect x="1188" y="636" width="216" height="104" rx="4" fill="#ede5fa" stroke="#56349a"/><text x="1200" y="664" class="name">API 스캔 요청</text><text x="1200" y="692" class="small">개별 경로 우선</text><text x="1200" y="716" class="small">필요 시 보관함 스캔</text><rect x="1188" y="780" width="216" height="104" rx="4" fill="#fff" stroke="#bdb5ca"/><text x="1200" y="808" class="name">미디어 스캔 / 갱신</text><text x="1200" y="836" class="small">현재 경로 갱신 담당</text><path d="M40 920H1440" stroke="#d2cadf"/><text x="40" y="952" class="small">실선은 전달·실행 흐름입니다. 명령·웹훅·자체 감지를 동시에 중복 구성하지 않습니다.</text><text x="40" y="980" class="small">실패는 큐에 기록합니다. 결과 불명 시간 초과는 자동 재시도하지 않으며, 작업·로그 확인 후 수동 재시도합니다.</text><text x="40" y="1008" class="small">API 요청 완료는 전체 스캔 완료와 다를 수 있습니다. 실제 처리 상태는 BookOasis에서 확인하세요.</text></svg>
