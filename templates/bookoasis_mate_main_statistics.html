{# 저장된 ECharts 통계를 즉시 표시하고 통계 갱신은 별도로 실행합니다. #}
{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('bookoasis_mate.static', filename='css/bookoasis_mate.css') }}">
<script src="{{ url_for('bookoasis_mate.static', filename='vendor/echarts/echarts.min.js') }}"></script>
<script src="{{ url_for('bookoasis_mate.static', filename='js/bookoasis_mate.js') }}"></script>
<style>
.doctor-statistics-echart { height:340px; width:100%; min-width:0; }
.doctor-statistics-chart-card { min-width:0; }
#statistics_result[hidden] { display:none; }
</style>
<div class="doctor-toolbar doctor-statistics-toolbar">
  <select id="statistics_db_type" class="form-control form-control-sm" aria-label="통계 DB">
    <option value="general">일반 DB</option>
    {% if arg.get('adult_enabled') == 'True' %}<option value="adult">성인 DB</option>{% endif %}
    <option value="audiobook">오디오북 DB</option><option value="video">비디오 DB</option>
  </select>
  <select id="statistics_library" class="form-control form-control-sm" aria-label="통계 보관함"><option value="">전체 보관함</option></select>
  <button id="statistics_start" type="button" class="btn btn-sm btn-primary">통계 갱신</button>
  <button id="statistics_stop" type="button" class="btn btn-sm btn-outline-secondary" disabled>갱신 중지</button>
</div>
<p class="doctor-muted">저장된 결과를 바로 표시합니다. 시작 후·6시간마다 DB별 순차 집계하며, 통계 갱신은 선택한 DB의 전체 보관함을 백그라운드에서 갱신합니다. 최초 집계 전에는 대기 안내가 표시됩니다. 실패·중지 시 마지막 정상 결과를 유지합니다.</p>
<section class="doctor-card doctor-statistics-status" aria-live="polite">
  <strong id="statistics_status_title">통계 조회 중</strong>
  <div id="statistics_status_message" class="doctor-muted"></div>
  <div class="doctor-live-progress-track" aria-hidden="true"><div id="statistics_progress_bar" class="doctor-live-progress-bar"></div></div>
  <div id="statistics_error" class="doctor-live-error"></div>
</section>
<section id="statistics_result" hidden>
  <h3 id="statistics_result_title">라이브러리 통계</h3>
  <p id="statistics_result_meta" class="doctor-muted"></p>
  <div id="statistics_kpis" class="doctor-statistics-kpis"></div>
  <div id="statistics_charts" class="doctor-statistics-grid"></div>
</section>
<script src="{{ url_for('bookoasis_mate.static', filename='js/library_statistics.js') }}"></script>
{% endblock %}
